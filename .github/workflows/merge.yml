name: merge
on:
  push:
    branches: [master]

permissions:
  contents: write
  
jobs:
  docker-Sonar-Scan:
    uses: ./.github/workflows/Sonarcube.yml
    with:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    secrets: 
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Generate-tags:
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.tag.outputs.sha_short }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set image tag
        id: tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  ArgoCD-deployment:
    needs: [Generate-tags]
    uses: ./.github/workflows/gitops_bump.yml
    with:
      Tag: ${{ needs.Generate-tags.outputs.short-sha }}
      
  push-to-docker-Hub:
    uses: ./.github/workflows/docker-push.yml
    with:
      frontend-dockerfile-dir: frontend
      backend-dockerfile-dir: backend
    secrets: 
      docker_username: ${{ vars.DOCKER_USER }}
      docker_password: ${{ secrets.DOCKER_TOKEN }}
